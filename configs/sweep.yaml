batch_sizes: [2, 4, 8, 16, 32, 64, 128]
benchmark_types:
  prefill: []
  chat: []
  reasoning: [mmlu_pro]
  agentic: [mini_swe_agent]
port: 30000
server_startup_timeout_seconds: 3600
estimator_mode: component-wise

# NSCC Singapore / Aspire2A defaults:
# - scripts/nscc_env.sh sets SBENCH_GPU_TYPE/ANALYZE_GPU_TYPE to NVIDIA A100-SXM4-40GB.
# - PBS currently requests 1 node with 4 GPUs, so both selected models use tp: 4.
# - Keep model context and chunked prefill at 16K for comparable runs.
sglang_server_flags:
  - --disable-custom-all-reduce
  - --disable-radix-cache

models:
  # Dense / non-MoE baseline (GQA). Component-wise estimation does not require
  # routed expert capture for this model.
  - id: Qwen/Qwen3-8B
    slug: qwen3_8b
    tp: 4
    sglang_server_flags:
      - --served-model-name: qwen3_8b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

  # Regular MoE comparison target. The orchestrator auto-enables SGLang routed
  # expert capture flags for MoE models so component-wise MoE bandwidth can use
  # runtime expert activation when available.
  - id: Qwen/Qwen3-30B-A3B
    slug: qwen3_30b_a3b
    tp: 4
    sglang_server_flags:
      - --served-model-name: qwen3_30b_a3b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90
