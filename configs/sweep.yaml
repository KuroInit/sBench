batch_sizes: [2, 4, 8, 16, 32, 64, 128]
benchmark_types:
  prefill: []
  chat: [sharegpt]
  reasoning: [mmlu_pro]
  agentic: [mini_swe_agent]
port: 30000
server_startup_timeout_seconds: 3600
estimator_mode: component-wise

# Concurrent DCGM hardware profiling (see README "DCGM Hardware Profiling").
# Best-effort: runs proceed without telemetry when dcgmi is unavailable.
# interval_ms 25: ~4x denser samples than the previous 100ms — short eval
# runs (mmlu_pro decode) previously got only 28-68 telemetry samples. dmon
# accepts down to 1ms; FI_PROF fields may internally update slower than the
# requested interval, in which case repeated values are harmless (they are
# time-weighted during phase attribution).
dcgm:
  enabled: true
  interval_ms: 25
  fields: [1001, 1002, 1003, 1004, 1005]   # GR_ENGINE/SM_ACTIVE/SM_OCCUPANCY/TENSOR/DRAM

# Remote GPU server defaults (single node, 2 GPUs per model):
# - All models run with tp: 2.
sglang_server_flags:
  - --disable-custom-all-reduce
  - --disable-radix-cache

models:
  # Sweep roster — the ONLY models this sweep may contain. To remove a model
  # from the active sweep, comment out its block; never delete entries.
  #
  # Currently active: one MoE + one dense counterpart (Qwen3-30B-A3B, Qwen3-32B).

  # Qwen3-14B: Dense / non-MoE. Standard Qwen3 GQA-style transformer; full attention.
  - id: Qwen/Qwen3-14B
    slug: qwen3_14b
    tp: 2
    sglang_server_flags:
    - --served-model-name: qwen3_14b
    - --dtype: bfloat16
    - --context-length: 16384
    - --chunked-prefill-size: 16384
    - --max-prefill-tokens: 16384
    - --mem-fraction-static: 0.90

  # Qwen3-32B: Dense / non-MoE. Standard Qwen3 GQA-style transformer; full attention.
  - id: Qwen/Qwen3-32B
    slug: qwen3_32b
    tp: 2
    sglang_server_flags:
      - --served-model-name: qwen3_32b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

  # Qwen3-30B-A3B: MoE. GQA-style transformer; active A3B-style sparse MoE.
  - id: Qwen/Qwen3-30B-A3B
    slug: qwen3_30b_a3b
    tp: 2
    sglang_server_flags:
      - --served-model-name: qwen3_30b_a3b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

  # Qwen3.5-9B: Dense / non-MoE. Hybrid attention.
  - id: Qwen/Qwen3.5-9B
    slug: qwen3_5_9b
    tp: 2
    sglang_server_flags:
    - --served-model-name: qwen3_5_9b
    - --dtype: bfloat16
    - --context-length: 16384
    - --chunked-prefill-size: 16384
    - --max-prefill-tokens: 16384
    - --mem-fraction-static: 0.90

  # Qwen3.6-27B: Dense / non-MoE. Hybrid attention.
  - id: Qwen/Qwen3.6-27B
    slug: qwen3_6_27b
    tp: 2
    sglang_server_flags:
    - --served-model-name: qwen3_6_27b
    - --dtype: bfloat16
    - --context-length: 16384
    - --chunked-prefill-size: 16384
    - --max-prefill-tokens: 16384
    - --mem-fraction-static: 0.90

  # Qwen3.6-35B-A3B: MoE. Hybrid attention; active A3B-style sparse MoE.
  - id: Qwen/Qwen3.6-35B-A3B
    slug: qwen3_6_35b_a3b
    tp: 2
    sglang_server_flags:
    - --served-model-name: qwen3_6_35b_a3b
    - --dtype: bfloat16
    - --context-length: 16384
