batch_sizes: [2, 4, 8, 16, 32, 64, 128]
benchmark_types:
  prefill: []
  chat: []
  reasoning: [mmlu_pro]
  agentic: [mini_swe_agent]
port: 30000
server_startup_timeout_seconds: 3600
estimator_mode: component-wise

# NSCC Singapore / Aspire2A defaults:
# - scripts/nscc_env.sh sets SBENCH_GPU_TYPE/ANALYZE_GPU_TYPE to NVIDIA A100-SXM4-40GB.
# - PBS currently requests 1 node with 4 GPUs, so selected models use tp: 4.
# - Dense models use 16K context/chunked prefill settings.
sglang_server_flags:
  - --disable-custom-all-reduce
  - --disable-radix-cache

models:
  # Active dense / non-MoE models. Component-wise estimation does not require
  # routed expert capture for these models.
  # Qwen3-14B: standard Qwen3 GQA-style transformer; full attention.
  - id: Qwen/Qwen3-14B
    slug: qwen3_14b
    tp: 4
    sglang_server_flags:
      - --served-model-name: qwen3_14b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

  # Qwen3-32B: standard Qwen3 GQA-style transformer; full attention.
  - id: Qwen/Qwen3-32B
    slug: qwen3_32b
    tp: 4
    sglang_server_flags:
      - --served-model-name: qwen3_32b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

  # Qwen3.5-9B: dense / non-MoE with hybrid attention.
  - id: Qwen/Qwen3.5-9B
    slug: qwen3_5_9b
    tp: 4
    sglang_server_flags:
      - --served-model-name: qwen3_5_9b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

  # Qwen3.6-27B: dense / non-MoE with hybrid attention.
  - id: Qwen/Qwen3.6-27B
    slug: qwen3_6_27b
    tp: 4
    sglang_server_flags:
      - --served-model-name: qwen3_6_27b
      - --dtype: bfloat16
      - --context-length: 16384
      - --chunked-prefill-size: 16384
      - --max-prefill-tokens: 16384
      - --mem-fraction-static: 0.90

