benchmark_type: agentic
dataset_names: [mini_swe_agent]
runner: mini_swe_agent
subset: lite
split: dev
environment_class: singularity
precision: bfloat16
target_output_tokens: 0
num_samples: 200
metric_sample_steps: 200
# For profiling, materialize a small issue pool per concurrency point instead
# of running one issue for every nominal worker. This gives real multi-agent
# load up to 8 concurrent SWE instances without risking 64 Singularity jobs.
issue_count_from_batch_size: true
max_issue_count: 8
max_workers: 8
min_success_rate: 1.0
prefix_cache: true
# Profiling validity is determined from server traces; patch submission is
# recorded separately in metadata/raw_values and should not discard trace data.
require_output_artifacts: true
predictions_file: preds.json
timeout_seconds: 14400
model_class: litellm_textbased
local_openai: true
custom_llm_provider: openai
mini_swe_configs:
  - swebench.yaml
  - swebench_xml
  - 'environment.exec_args=["--contain","--cleanenv"]'
extra_args: ["--redo-existing"]

