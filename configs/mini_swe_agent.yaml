benchmark_type: agentic
dataset_names: [mini_swe_agent]
runner: mini_swe_agent
subset: lite
split: dev
environment_class: singularity
precision: bfloat16
target_output_tokens: 0
num_samples: 200
metric_sample_steps: 200
# Profiling, materialize a small issue pool per concurrency point instead
# of running one issue for every nominal worker. This gives real multi-agent
# load up to 8 concurrent SWE instances without risking 64 Singularity jobs.
issue_count_from_batch_size: true
# The NSCC Apptainer-compatible Singularity binary can automatically bind host
# `/export` paths. SWE-bench images lack that destination, and a writable
# sandbox cannot create it; every agent command then exits 255. The override
# below disables configured bind paths and the automatic CWD bind. The runner
# also clears inherited bind environment variables and starts mini-SWE-agent in
# `/tmp`.
max_issue_count: 8
max_workers: 8
min_success_rate: 1.0
prefix_cache: true
# Profiling validity is determined from server traces; patch submission is
# recorded separately in metadata/raw_values and should not discard trace data.
require_output_artifacts: true
predictions_file: preds.json
timeout_seconds: 14400
model_class: litellm_textbased
local_openai: true
custom_llm_provider: openai
mini_swe_configs:
  - swebench.yaml
  - swebench_xml
  - 'environment.exec_args=["--contain","--cleanenv","--no-mount","bind-paths,cwd,hostfs,/export"]'

# Qwen3.5 hybrid models default to a thinking response. mini-SWE-agent's
# text-action parser needs its XML action in the visible message content.
model_overrides:
  qwen3_5_9b:
    mini_swe_configs:
      - swebench.yaml
      - swebench_xml
      - 'environment.exec_args=["--contain","--cleanenv","--no-mount","bind-paths,cwd,hostfs,/export"]'
      - configs/mini_swe_agent_qwen_nonthinking.yaml
  qwen3_6_27b:
    mini_swe_configs:
      - swebench.yaml
      - swebench_xml
      - 'environment.exec_args=["--contain","--cleanenv","--no-mount","bind-paths,cwd,hostfs,/export"]'
      - configs/mini_swe_agent_qwen_nonthinking.yaml
extra_args: ["--redo-existing"]

